<text x="84" y="141" font-family="Segoe UI, 'Noto Sans KR', Pretendard, sans-serif" font-size="13" font-weight="normal" fill="#262730" text-anchor="start">김하늘 (32세, 직장인) — 모니터를 오래 보는 업무 특성상 눈이 쉽게 피로해지고, 만성 피로도 함께 겪고 있다</text>
<text x="84" y="161" font-family="Segoe UI, 'Noto Sans KR', Pretendard, sans-serif" font-size="12.5" font-weight="normal" fill="#6E7079" text-anchor="start">고민: 영양제 종류가 너무 많아 무엇을 골라야 할지 몰라 검색만 반복한다   →   목표: 내 상태에 맞는 영양제를 빠르고 안전하게 고르고 싶다</text>
