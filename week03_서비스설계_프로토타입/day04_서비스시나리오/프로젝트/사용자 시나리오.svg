<text x="60" y="560" font-family="Segoe UI, 'Noto Sans KR', Pretendard, sans-serif" font-size="12.5" font-weight="normal" fill="#6E7079" text-anchor="start">※ Day02 User Flow(Step1~6)와 Day03 스크린리스트를 그대로 이어 붙인 것이 정상 시나리오입니다.</text>
