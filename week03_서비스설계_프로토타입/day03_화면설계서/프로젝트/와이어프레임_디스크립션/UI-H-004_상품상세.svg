<text x="1042" y="506" font-family="Segoe UI, 'Noto Sans KR', Pretendard, sans-serif" font-size="12" font-weight="normal" fill="#262730" text-anchor="start">1. 성분 쉬운 설명은 영양소_기능성_추천DB_확장판.csv의 근거_설명을 쉬운 문장으로 가공해 표시한다.</text>
